name: CEREBRON Bidirectional Bus Runtime Canary
on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime/cerebron_core.py'
      - '.github/workflows/cerebron-bus-runtime-canary.yml'
permissions:
  contents: read
jobs:
  bus-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute deterministic CEREBRON bus routing
        run: |
          python runtime/cerebron_core.py \
            --task "Route one synthetic mission across the five AI identities without fabricating downstream execution." \
            --task-id "CANARY-E2E-001" --checkpoint "CEREBRON-167" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-bus-runtime-receipt
          path: out/bus-runtime-receipt.json
          retention-days: 14
